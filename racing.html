<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="data:," />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Apex Grand Prix</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0e14; --panel: rgba(14, 18, 27, 0.86); --line: rgba(255, 255, 255, 0.12); --fg: #f2f4f8; --dim: #9aa4b5; --acc: #e10600; --ok: #24e06a; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* todo el interfaz escala con la pantalla: 1em = unidad adaptada al lado corto y al ancho */
      #ui { position: fixed; inset: 0; font-size: clamp(10px, 1.25vmin + 0.55vw, 19px); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); pointer-events: none; }
      #ui > * { pointer-events: auto; }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; }
      .screen { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; background: linear-gradient(160deg, rgba(8, 10, 16, 0.94), rgba(20, 8, 10, 0.9)); padding-block: 1.4em 2em; padding-left: max(16px, 1.4em, env(safe-area-inset-left, 0px)); padding-right: max(16px, 1.4em, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 1em; }
      .screen.glass { background: rgba(6, 8, 13, 0.72); backdrop-filter: blur(6px); justify-content: center; }
      h1 { font-size: 2.6em; margin: 0.2em 0 0; letter-spacing: 0.06em; font-style: italic; font-weight: 900; text-align: center; }
      h1 b { color: var(--acc); }
      h2 { font-size: 1.25em; margin: 0.6em 0 0.2em; text-transform: uppercase; letter-spacing: 0.08em; align-self: stretch; border-left: 0.3em solid var(--acc); padding-left: 0.6em; }
      .sub { color: var(--dim); text-align: center; margin: 0; }
      .col { display: flex; flex-direction: column; gap: 0.7em; width: min(100%, 26em); }
      .btn { background: #1b2130; border: 1px solid var(--line); border-radius: 0.5em; padding: 0.85em 1.2em; font-weight: 700; font-size: 1.05em; text-align: center; min-height: 2.8em; }
      .btn.pri { background: var(--acc); border-color: transparent; }
      .btn:active { transform: scale(0.97); filter: brightness(1.2); }
      .row2 { display: flex; gap: 0.7em; flex-wrap: wrap; justify-content: center; width: 100%; }
      .grid { display: grid; gap: 0.5em; width: 100%; grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr)); }
      .chip { background: #151a26; border: 2px solid transparent; border-radius: 0.5em; padding: 0.5em 0.6em; text-align: left; display: flex; gap: 0.5em; align-items: center; min-height: 3em; }
      .chip.on { border-color: var(--fg); background: #232b3d; }
      .chip i { width: 0.45em; align-self: stretch; border-radius: 0.2em; flex: none; }
      .chip small { display: block; color: var(--dim); font-size: 0.78em; }
      .chip svg { width: 3.6em; height: 2.6em; flex: none; }
      .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: 0.6em 1.2em; width: 100%; }
      .opt { display: flex; justify-content: space-between; align-items: center; gap: 0.6em; background: #151a26; border-radius: 0.5em; padding: 0.5em 0.7em; }
      .opt button { background: #2a3347; border-radius: 0.4em; padding: 0.5em 0.8em; min-width: 7.5em; font-weight: 700; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      td, th { padding: 0.32em 0.5em; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--dim); font-weight: 600; font-size: 0.85em; }
      tr.me td { background: rgba(225, 6, 0, 0.28); font-weight: 700; }
      td i.bar { display: inline-block; width: 0.35em; height: 1em; border-radius: 0.15em; vertical-align: -0.12em; margin-right: 0.45em; }
      .tables { display: flex; gap: 1.5em; width: 100%; flex-wrap: wrap; align-items: flex-start; }
      .tables > div { flex: 1 1 20em; overflow-x: auto; }
      .ty { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; border: 0.2em solid currentColor; font-size: 0.72em; font-weight: 800; font-style: normal; background: #111; margin-right: 0.15em; }
      .ty.S { color: #e8262a; } .ty.M { color: #f2d21b; } .ty.H { color: #f0f0f0; } .ty.I { color: #2fb344; } .ty.W { color: #2a6fe0; }
      .tychoice { display: flex; gap: 0.6em; justify-content: center; flex-wrap: wrap; }
      .tychoice button { background: #151a26; border: 2px solid transparent; border-radius: 0.6em; padding: 0.5em 0.7em; display: flex; flex-direction: column; align-items: center; gap: 0.2em; min-width: 4.6em; font-size: 0.9em; }
      .tychoice button.on { border-color: var(--fg); }
      .tychoice .ty { font-size: 1.2em; }

      /* ---------- HUD ---------- */
      .hud { position: absolute; inset: 0; pointer-events: none !important; padding: inherit; }
      .hud > * { position: absolute; }
      .box { background: var(--panel); border: 1px solid var(--line); border-radius: 0.4em; }
      .tower { left: calc(0.7em + env(safe-area-inset-left)); top: calc(0.6em + env(safe-area-inset-top)); width: 12.5em; font-size: 0.9em; overflow: hidden; }
      .tower .th { display: flex; justify-content: space-between; padding: 0.3em 0.5em; background: #000; font-weight: 800; font-size: 0.9em; }
      .tower .r { display: grid; grid-template-columns: 1.5em 0.3em 2.9em 1fr 1.5em; gap: 0.35em; align-items: center; padding: 0.17em 0.4em; font-variant-numeric: tabular-nums; }
      .tower .r.me { background: rgba(225, 6, 0, 0.5); font-weight: 800; }
      .tower .r i { height: 1em; border-radius: 0.1em; }
      .tower .r .g { text-align: right; color: #d4d9e2; font-size: 0.9em; }
      .tower .r.out { opacity: 0.5; }
      .info { right: calc(0.7em + env(safe-area-inset-right)); top: calc(0.6em + env(safe-area-inset-top)); padding: 0.35em 0.6em; text-align: right; font-variant-numeric: tabular-nums; min-width: 9.5em; font-size: 0.9em; }
      .info .pos b { font-size: 1.9em; } .info .pos { color: var(--dim); }
      .info .t { font-size: 1.25em; font-weight: 700; }
      .info .sm { color: var(--dim); font-size: 0.85em; }
      .info .pen { color: #ffb020; font-weight: 800; }
      .banner { left: 50%; top: calc(0.6em + env(safe-area-inset-top)); transform: translateX(-50%); padding: 0.35em 1.1em; font-weight: 900; letter-spacing: 0.05em; border-radius: 0.3em; text-align: center; max-width: 48vw; opacity: 0; transition: opacity 0.25s; }
      .banner.show { opacity: 1; }
      .banner.yellow { background: #ffd500; color: #111; } .banner.green { background: #17b34a; } .banner.sc { background: #ffd500; color: #111; box-shadow: 0 0 0 0.25em #111 inset; }
      .banner.blue { background: #1c63ff; } .banner.bw { background: linear-gradient(135deg, #fff 50%, #111 50%); color: #e10600; } .banner.black { background: #000; border: 2px solid #fff; }
      .banner.pen { background: #b00; } .banner.info { background: var(--panel); } .banner.purple { background: #8a2be2; } .banner.chequered { background: repeating-conic-gradient(#111 0 25%, #eee 0 50%) 0 0/1.4em 1.4em; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; } .banner.rain { background: #2a6fe0; }
      .feed { left: 50%; top: calc(3.2em + env(safe-area-inset-top)); transform: translateX(-50%); width: min(30em, 50vw); display: flex; flex-direction: column; gap: 0.2em; align-items: center; font-size: 0.82em; }
      .feed div { background: var(--panel); padding: 0.2em 0.7em; border-radius: 0.3em; animation: fade 6s forwards; text-align: center; }
      .feed div.pen { border-left: 0.3em solid #ffb020; } .feed div.mine { color: #ffd76a; }
      @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
      .lights { left: 50%; top: 24%; transform: translateX(-50%); display: flex; gap: 0.6em; padding: 0.6em 0.9em; background: #0a0a0a; border-radius: 0.6em; border: 2px solid #333; }
      .lights i { width: 2.2em; height: 2.2em; border-radius: 50%; background: #2a0505; } .lights i.on { background: #ff1a1a; box-shadow: 0 0 1.2em #ff1a1a; }
      .map { left: calc(0.7em + env(safe-area-inset-left)); top: calc(12.6em + env(safe-area-inset-top)); width: 9em; height: 7em; opacity: 0.92; }
      .dash { left: 50%; bottom: calc(0.6em + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 0.35em 0.9em 0.45em; display: grid; grid-template-columns: auto auto auto; gap: 0 0.9em; align-items: center; text-align: center; }
      .dash .bar { grid-column: 1 / 4; height: 0.5em; background: #222; border-radius: 0.25em; overflow: hidden; margin-bottom: 0.25em; }
      .dash .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #24e06a 60%, #ffd500 80%, #e10600 92%); }
      .dash .spd b { font-size: 1.9em; font-variant-numeric: tabular-nums; } .dash small { color: var(--dim); display: block; font-size: 0.7em; }
      .dash .gear { font-size: 2.3em; font-weight: 900; width: 1.1em; }
      .dash .ers { width: 4.2em; } .dash .ers .bar { margin: 0.2em 0 0; } .dash .ers .bar i { background: #f2d21b; }
      .tyre { right: calc(0.7em + env(safe-area-inset-right)); top: calc(8.4em + env(safe-area-inset-top)); padding: 0.35em 0.6em; font-size: 0.85em; display: grid; grid-template-columns: auto auto; gap: 0.1em 0.6em; align-items: center; }
      .tyre .ty { font-size: 1.15em; grid-row: 1 / 3; } .tyre .bad { color: #ff5a4d; font-weight: 800; }
      .hbtns { right: calc(11.5em + env(safe-area-inset-right)); top: calc(0.6em + env(safe-area-inset-top)); display: flex; gap: 0.4em; pointer-events: auto !important; }
      .hbtns button, .tbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 0.5em; min-width: 2.7em; height: 2.7em; font-weight: 800; padding: 0 0.6em; pointer-events: auto; }
      .tbtn.on { background: #f2d21b; color: #111; } #t-pit.on { background: var(--acc); color: #fff; }
      .steer { left: env(safe-area-inset-left); bottom: env(safe-area-inset-bottom); width: 46%; height: 52%; pointer-events: auto !important; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 1em 1em; gap: 1em; }
      .steer span { flex: 0 1 6.5em; height: 6.5em; display: grid; place-items: center; font-size: 1.3em; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.28); max-width: 40%; }
      .steer span.on { background: rgba(255, 255, 255, 0.35); }
      .steer .knob { position: absolute; bottom: 0.5em; left: 50%; width: 3em; height: 0.5em; margin-left: -1.5em; border-radius: 0.3em; background: #fff; opacity: 0.8; }
      .pedals { right: calc(0.8em + env(safe-area-inset-right)); bottom: calc(0.8em + env(safe-area-inset-bottom)); display: flex; gap: 0.8em; align-items: flex-end; pointer-events: auto !important; }
      .pedal { width: 6em; height: 8.5em; border-radius: 0.9em; background: rgba(36, 224, 106, 0.22); border: 2px solid rgba(36, 224, 106, 0.7); font-weight: 900; font-size: 1em; pointer-events: auto; }
      .pedal.brake { background: rgba(225, 6, 0, 0.25); border-color: rgba(255, 70, 60, 0.8); height: 7em; }
      .pedal.on { filter: brightness(1.7); }
      .side { right: calc(0.8em + env(safe-area-inset-right)); bottom: calc(10.6em + env(safe-area-inset-bottom)); display: flex; gap: 0.5em; pointer-events: auto !important; }
      .pitpanel { right: calc(0.8em + env(safe-area-inset-right)); bottom: calc(14em + env(safe-area-inset-bottom)); padding: 0.4em; display: none; gap: 0.3em; pointer-events: auto !important; font-size: 0.9em; }
      .pitpanel.show { display: flex; } .pitpanel button { background: none; padding: 0.2em; border-radius: 0.4em; border: 2px solid transparent; } .pitpanel button.on { border-color: #fff; } .pitpanel .ty { font-size: 1.3em; margin: 0; }
      .note { left: 50%; bottom: calc(6.4em + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 0.3em 0.9em; font-weight: 800; text-align: center; display: none; }
      .note.show { display: block; }
      .nokeys .steer, .nokeys .pedals { display: none; }
      @media (orientation: portrait) {
        .tower { font-size: 0.8em; } .info { font-size: 0.8em; } .hbtns { right: calc(0.7em + env(safe-area-inset-right)); top: calc(13em + env(safe-area-inset-top)); flex-direction: column; }
        .banner { top: calc(9.5em + env(safe-area-inset-top)); max-width: 90vw; } .feed { top: calc(15.6em + env(safe-area-inset-top)); width: 70vw; }
        .tyre { top: calc(7.6em + env(safe-area-inset-top)); } .map { top: calc(11.6em + env(safe-area-inset-top)); }
        .dash { bottom: calc(13.5em + env(safe-area-inset-bottom)); } .steer { height: 34%; width: 50%; } .note { bottom: calc(19.5em + env(safe-area-inset-bottom)); }
      }
      @media (max-height: 420px) and (orientation: landscape) { .map { top: auto; bottom: 56%; left: 44%; display: none; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/racing/main.ts"></script>
  </body>
</html>
