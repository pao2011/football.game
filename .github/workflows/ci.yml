name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test-web:
    name: Pruebas y compilación web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Pruebas unitarias y de simulación
        run: npm test
      - name: Compilación
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: football-elite-3d-web
          path: dist/

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    needs: test-web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Copiar el juego al proyecto Android
        run: npx cap sync android
      - name: Compilar APK (debug, instalable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FootballElite3D-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FootballElite3D.apk
      - name: Publicar APK descargable (Release "latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Football Elite 3D — APK más reciente" --latest
          else
            gh release create latest --title "Football Elite 3D — APK más reciente" --latest \
              --notes "APK de Android compilado automáticamente desde la rama main. Descárgalo e instálalo (permite \"orígenes desconocidos\")."
          fi
          gh release upload latest FootballElite3D.apk --clobber
