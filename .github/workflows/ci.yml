name: CI

on:
  # PRs y main (antes también cada rama: con un PR abierto, cada push corría dos veces y se duplicaban los artefactos)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-web:
    name: Pruebas y compilación web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Pruebas unitarias y de simulación
        run: npm test
      - name: Compilación (incluye jugar.html, el juego en un solo archivo)
        run: npm run build
      - name: Chromium para la prueba sin servidor
        run: npx playwright-core install chromium
      - name: Jugar sin servidor (doble clic en index.html tras descargar el ZIP)
        run: node scripts/e2e-file.mjs index.html
      - name: Audio por análisis de señal (cada sonido suena, sin saturar; paneo 3D)
        run: node scripts/e2e-audio.mjs
      - name: Aviso si jugar.html está desactualizado
        run: git diff --quiet -- jugar.html || echo "::warning file=jugar.html::jugar.html no coincide con el código. Ejecuta 'npm run build' y súbelo para que el ZIP del repositorio funcione con doble clic."
      - name: Servidor online (arranca y responde)
        run: |
          PORT=18555 DATA_DIR=$(mktemp -d) node server/index.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:18555/estado && break; sleep 0.5; done
          curl -sf http://localhost:18555/estado | grep -q football-elite-3d
          kill %1

  windows:
    name: Ejecutable de Windows (ZIP)
    # solo a pedido (Run workflow): gasta el doble de minutos que Linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # después del APK: así el Release "latest" ya existe cuando se sube el ZIP
    needs: [test-web, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar y empaquetar con Electron
        run: npm run package
        env:
          PLATFORMS: win32
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path release/FootballElite3D-win32-x64 -DestinationPath FootballElite3D-Windows.zip
      - name: Instalador (.exe con accesos directos y desinstalador)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\windows.iss
          Copy-Item release\FootballElite3D-Setup.exe FootballElite3D-Setup.exe
      - uses: actions/upload-artifact@v4
        continue-on-error: true # si la cuota de artefactos está llena no se bloquea el CI ni el Release
        with:
          name: FootballElite3D-Windows
          retention-days: 1
          path: |
            FootballElite3D-Windows.zip
            FootballElite3D-Setup.exe
      - name: Publicar ZIP de Windows y juego en un solo archivo (Release "latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/jugar.html FootballElite3D.html
          gh release edit latest --title "Soffti's Football Game — descargas más recientes" --latest \
            --notes "Compilado automáticamente desde la rama main. Android: instala FootballElite3D.apk (permite \"orígenes desconocidos\"). Windows: instala con FootballElite3D-Setup.exe (o descarga FootballElite3D-Windows.zip, extráelo y abre FootballElite3D.exe). macOS: FootballElite3D-macOS.zip (la primera vez, clic derecho → Abrir). Cualquier PC: abre FootballElite3D.html con doble clic en Chrome, Edge o Firefox."
          gh release upload latest FootballElite3D-Windows.zip FootballElite3D-Setup.exe FootballElite3D.html --clobber

  macos:
    name: Aplicación de macOS
    # solo a pedido (Run workflow): gasta diez veces los minutos de Linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # después del APK: así el Release "latest" ya existe cuando se sube la app
    needs: [test-web, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar y empaquetar con Electron (Intel y Apple Silicon)
        run: npm run package
        env:
          PLATFORMS: darwin
          ARCH: universal
      - name: Comprimir
        run: ditto -c -k --keepParent "release/FootballElite3D-darwin-universal/FootballElite3D.app" FootballElite3D-macOS.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true # si la cuota de artefactos está llena no se bloquea el CI ni el Release
        with:
          name: FootballElite3D-macOS
          retention-days: 1
          path: FootballElite3D-macOS.zip
      - name: Publicar app de macOS (Release "latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest FootballElite3D-macOS.zip --clobber

  android:
    name: APK de Android
    # en los PR no se compila (solo se publica desde main): ahorra minutos
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test-web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Copiar el juego al proyecto Android
        run: npx cap sync android
      - name: Compilar APK (debug, instalable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true # si la cuota de artefactos está llena no se bloquea el CI ni el Release
        with:
          name: FootballElite3D-android-apk
          retention-days: 1
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FootballElite3D.apk
      - name: Publicar APK descargable (Release "latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Soffti's Football Game — descargas más recientes" --latest
          else
            gh release create latest --title "Soffti's Football Game — descargas más recientes" --latest \
              --notes "APK de Android compilado automáticamente desde la rama main. Descárgalo e instálalo (permite \"orígenes desconocidos\")."
          fi
          gh release upload latest FootballElite3D.apk --clobber
