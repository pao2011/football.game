const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud');
const face=new Image();face.src=F;
let W,H,zb;
function rs(){W=cv.width=innerWidth>>1;H=cv.height=innerHeight>>1;zb=new Float32Array(W)}
addEventListener('resize',rs);rs();

const M=21,SP=3.5;
let map,px,py,a,bx,by,bt,t,grace,run=false,tp,dx,dy,plx,ply;
function gen(){
  map=Array.from({length:M},()=>Array(M).fill(1));
  const st=[[1,1]];map[1][1]=0;
  while(st.length){
    const[x,y]=st[st.length-1];
    const d=[[2,0],[-2,0],[0,2],[0,-2]].filter(([p,q])=>x+p>0&&x+p<M-1&&y+q>0&&y+q<M-1&&map[y+q][x+p]);
    if(!d.length){st.pop();continue}
    const[p,q]=d[Math.random()*d.length|0];
    map[y+q/2][x+p/2]=0;map[y+q][x+p]=0;st.push([x+p,y+q]);
  }
  for(let i=0;i<30;i++){const x=1+Math.random()*(M-2)|0,y=1+Math.random()*(M-2)|0;if(x%2!==y%2)map[y][x]=0} // loops, so you can run in circles
}
const solid=(x,y,r)=>[[-r,-r],[r,-r],[-r,r],[r,r]].some(([u,v])=>map[y+v|0][x+u|0]);

// BFS from the player; the bot's predecessor is its next cell
function nextStep(){
  const sx=bx|0,sy=by|0,tx=px|0,ty=py|0;
  if(sx===tx&&sy===ty)return[px,py];
  const s=sy*M+sx,prev=new Int16Array(M*M).fill(-1),q=[ty*M+tx];prev[q[0]]=q[0];
  for(let i=0;i<q.length&&prev[s]<0;i++){const c=q[i];
    for(const o of[1,-1,M,-M]){const n=c+o;if(n>=0&&n<M*M&&!map[n/M|0][n%M]&&prev[n]<0){prev[n]=c;q.push(n)}}}
  const n=prev[s];return[n%M+.5,(n/M|0)+.5];
}

// audio: drone that rises as the bot gets close
let ac,osc,gn;
function snd(){try{if(ac)return;ac=new AudioContext();osc=ac.createOscillator();osc.type='sawtooth';gn=ac.createGain();gn.gain.value=0;osc.connect(gn).connect(ac.destination);osc.start()}catch(e){}}
function vol(v,f){try{gn.gain.value=v;osc.frequency.value=f}catch(e){}}

// input
const T={},K={};
let turn=0;
cv.addEventListener('pointerdown',e=>{T[e.pointerId]={m:e.clientX<innerWidth/2,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const p=T[e.pointerId];if(!p)return;if(!p.m)turn+=(e.clientX-p.x)*.007;p.x=e.clientX;p.y=e.clientY});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>delete T[e.pointerId]));
addEventListener('keydown',e=>K[e.key.toLowerCase()]=1);addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);

function start(){
  snd();gen();px=py=1.5;a=map[1][2]?Math.PI/2:0;bx=by=11.5;t=0;grace=3;bt=0;tp=[bx,by];run=true;ov.style.display='none';last=performance.now();
}
function end(win){
  run=false;vol(win?0:.6,win?0:40);
  ov.style.display='flex';
  ov.innerHTML=win?`<h1>¡ESCAPASTE!</h1><div>${t.toFixed(1)} s</div><button onclick="start()">Otra vez</button>`
                  :`<img src="${F}"><h1>TE ATRAPÓ</h1><div>${t.toFixed(1)} s</div><button onclick="start()">Reintentar</button>`;
}
ov.innerHTML=`<img src="${F}"><h1>NEXTBOT</h1><div>Llega al muro verde.<br>Izquierda: moverte · Derecha: mirar<br>(PC: WASD + flechas)</div><button onclick="start()">JUGAR</button>`;

function spr(x,y,src,k){
  const sx=x-px,sy=y-py,det=1/(plx*dy-dx*ply),tx=det*(dy*sx-dx*sy),ty=det*(-ply*sx+plx*sy);
  if(ty<.1)return;
  const z=H/ty*k,x0=W/2*(1+tx/ty)-z/2,top=H/2+H/ty/2-z;
  for(let c=Math.max(0,x0|0);c<Math.min(W,x0+z);c++){
    if(ty>=zb[c])continue;
    if(src)g.drawImage(src,(c-x0)/z*src.naturalWidth,0,1,src.naturalHeight,c,top,1,z);else g.fillRect(c,top,1,z);
  }
}

function draw(close){
  g.fillStyle='#14120a';g.fillRect(0,0,W,H/2);g.fillStyle='#2b2616';g.fillRect(0,H/2,W,H/2);
  dx=Math.cos(a);dy=Math.sin(a);plx=-dy*.66;ply=dx*.66;
  for(let c=0;c<W;c++){
    const cam=2*c/W-1,rx=dx+plx*cam,ry=dy+ply*cam;
    let mx=px|0,my=py|0,side=0;
    const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),sx=rx<0?-1:1,sy=ry<0?-1:1;
    let sdx=rx<0?(px-mx)*ddx:(mx+1-px)*ddx,sdy=ry<0?(py-my)*ddy:(my+1-py)*ddy;
    while(!map[my][mx]){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}}
    const d=side?sdy-ddy:sdx-ddx,h=H/d,s=Math.max(.06,1/(1+d*.35))*(side?.7:1);
    zb[c]=d;g.fillStyle=`rgb(${160*s|0},${145*s|0},${80*s|0})`;g.fillRect(c,(H-h)/2,1,h);
  }
  g.fillStyle='#0f0';
  const ex=M-1.5,eb=Math.hypot(bx-px,by-py)>Math.hypot(ex-px,ex-py);
  if(eb){spr(bx,by,face,.9);spr(ex,ex,0,1)}else{spr(ex,ex,0,1);spr(bx,by,face,.9)}
  if(close>0){g.fillStyle=`rgba(255,0,0,${close*.5})`;g.fillRect(0,0,W,H)}
  for(const p of Object.values(T))if(p.m){ // joystick
    g.strokeStyle='#fff8';g.beginPath();g.arc(p.x0/2,p.y0/2,28,0,7);g.stroke();
    g.beginPath();g.arc(p.x/2,p.y/2,10,0,7);g.stroke();
  }
}

let last=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!run){if(map)draw(0);return}
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  // player
  let f=(K.w||K.arrowup?1:0)-(K.s||K.arrowdown?1:0),st=(K.d?1:0)-(K.a?1:0);
  a+=turn+((K.arrowright||K.e?1:0)-(K.arrowleft||K.q?1:0))*2.2*dt;turn=0;
  for(const p of Object.values(T))if(p.m){f-=Math.max(-1,Math.min(1,(p.y-p.y0)/45));st+=Math.max(-1,Math.min(1,(p.x-p.x0)/45))}
  const n=Math.hypot(f,st)||1,k=Math.min(1,n)*SP*dt/n,mx=(Math.cos(a)*f-Math.sin(a)*st)*k,my=(Math.sin(a)*f+Math.cos(a)*st)*k;
  if(!solid(px+mx,py,.2))px+=mx;if(!solid(px,py+my,.2))py+=my;
  // bot
  let d=Math.hypot(bx-px,by-py);
  if(grace>0)grace-=dt;else{
    bt-=dt;if(bt<=0){bt=.2;tp=nextStep()}
    const v=Math.min(4.2,2.6+t*.05)*dt,ux=tp[0]-bx,uy=tp[1]-by,l=Math.hypot(ux,uy)||1;
    bx+=ux/l*Math.min(v,l);by+=uy/l*Math.min(v,l);
  }
  d=Math.hypot(bx-px,by-py);
  const near=Math.max(0,1-d/8);
  vol(grace>0?0:near*.25,60+near*140);
  hud.textContent=grace>0?`Corre… ${Math.ceil(grace)}`:`${t.toFixed(1)} s`;
  draw(near);
  if(d<.5)end(false);else if(Math.hypot(px-(M-1.5),py-(M-1.5))<.7)end(true);
}
requestAnimationFrame(loop);
</script></body></html>
